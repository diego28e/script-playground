# Local development database: `docker compose -f infra/dev/compose.yaml up -d`, then point `.env.local` at it
# (copy `.env.local.example`). Development only: the credentials below never leave your machine.
name: academia-dev

services:
  db:
    image: postgres:17-alpine
    container_name: academia-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: academia-dev
      POSTGRES_DB: academia
    # 5432 is often taken by other local databases; 127.0.0.1 keeps it off the network.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
