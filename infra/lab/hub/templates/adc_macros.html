{#- Shared pieces of the Academia del Código card pages. card_top uses static_url, so import with context:
    {% from "adc_macros.html" import card_top, arrow with context %} -#}

{% macro card_top() %}
  <div class="adc-card-top">
    <img class="adc-mark" src="{{ static_url('images/academia-logo.png') }}" alt="" width="57" height="32">
    <span class="adc-eyebrow">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg><span class="adc-es" lang="es">Laboratorio</span><span class="adc-en" lang="en">Lab</span>
    </span>
  </div>
{% endmacro %}

{% macro arrow() %}
  <svg class="adc-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
{% endmacro %}
