# nginx site for the lab. Replace LAB_DOMAIN, install as /etc/nginx/sites-available/<domain>,
# link it into sites-enabled, then run `sudo certbot --nginx -d <domain>` to add TLS and the redirect.
# Run certbot before starting the hub, so the lab is never served over plain HTTP.

# Kernel and terminal traffic are WebSockets. The variable name is unique so it can't clash with another site's map.
map $http_upgrade $lab_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name LAB_DOMAIN;

    # Notebook and data uploads through the file browser.
    client_max_body_size 100m;

    # The practice grader (../grader): the platform signs every request; it answers POST /v1/run and GET /healthz.
    # On a server set up before the grader existed, this block lives in /etc/nginx/snippets/lab-grader.conf, included
    # in the site's TLS server block (infra/lab/README.md, "The practice grader").
    location /grader/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lab_connection_upgrade;
        # Kernels sit idle on an open WebSocket for a long time; streamed output must not be buffered.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering off;
    }
}
