# The lab's hub, and the learning service (the AI tutor's backend). Student containers are not listed here: the hub
# starts one per student from LAB_IMAGE, on the same network, where they reach the service as http://learning:8080.
# Needs Docker Compose v2: `docker compose up -d --build` from this folder (see README.md).
name: lab

services:
  hub:
    build: hub
    image: lab-hub:6.1.1
    container_name: jupyterhub
    restart: unless-stopped
    env_file: .env
    environment:
      LAB_NETWORK: jupyterhub
      LAB_HUB_HOST: jupyterhub
    # Loopback only: nginx on the host terminates TLS. A published 0.0.0.0 port would skip the host firewall.
    ports:
      - "127.0.0.1:${LAB_HUB_PORT:-8000}:8000"
    volumes:
      # Lets the hub start and stop student containers. This makes the hub root-equivalent on the host:
      # no student code ever runs in it, and student containers never get the socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - hub-data:/srv/jupyterhub/data
    networks:
      - jupyterhub

  # The AI tutor's backend (docs/ai-tutor.md). Build its bundle on your PC first: `pnpm learning:build`.
  # Learners' Jupyter servers reach it on the jupyterhub network, and it checks every learner with the hub. Its loopback
  # port is for nginx, which publishes only the lesson tutor's routes (/learning/v1/lesson/, docs/lesson-tutor.md),
  # whose requests carry a pass the platform signed.
  learning:
    build: learning
    image: lab-learning:1
    container_name: learning
    restart: unless-stopped
    env_file: learning/.env
    environment:
      HUB_API_URL: http://jupyterhub:8081/hub/api
      PORT: "8080"
      # The self-hosted voice (pocket-tts-en and pocket-tts-es below, docs/voice.md "The free voice").
      POCKET_TTS_EN_URL: http://pocket-tts-en:8000
      POCKET_TTS_ES_URL: http://pocket-tts-es:8000
    ports:
      - "127.0.0.1:${LEARNING_PORT:-8091}:8080"
    mem_limit: 512m
    depends_on:
      - hub
    networks:
      - jupyterhub
      - voice

  # The practice grader (grader/server.mjs, docs/practice.md): runs learners' code answers in throwaway containers from
  # the student image, with no network and the gVisor runtime. Loopback port only: nginx serves it at /grader/ on the
  # lab's domain, and the platform signs every request with GRADER_SECRET (grader/.env).
  grader:
    build: grader
    image: lab-grader:1
    container_name: grader
    restart: unless-stopped
    env_file: grader/.env
    environment:
      GRADER_IMAGE: ${LAB_IMAGE}
      # TypeScript answers (grader/ts-sandbox, docs/practice.md "Languages"); empty: Python only.
      GRADER_TS_IMAGE: ${GRADER_TS_IMAGE:-}
      GRADER_RUNTIME: ${GRADER_RUNTIME:-runsc}
      PORT: "8080"
    ports:
      - "127.0.0.1:${GRADER_PORT:-8090}:8080"
    volumes:
      # Starts and removes the grading containers. Root-equivalent on the host, like the hub's: no learner code runs here.
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 256m

  # Bulk practice work the admin page starts (docs/practice.md "Jobs"): writes missing tasks and drafts lessons, with no
  # request time limit. It reaches the grader on the lab's default network (GRADER_URL=http://grader:8080) and the
  # platform's database and model APIs over the internet; nothing reaches it. On a stop it finishes the items in
  # progress first, hence the long grace period.
  # Memory: a long lesson's audio is 50 to 70 MB, held a few times over while it's joined and stored, and two lessons
  # are voiced at once. At 512m the worker was killed for memory three times on 2026-11-19 mid-voicing; the server has
  # 24 GB. The heap cap makes Node collect garbage well before the container's limit.
  # lesson-pieces keeps each voiced piece until its lesson's audio is stored, so a voicing cut off by a stop, a rebuild
  # or a crash picks up where it was instead of paying for its pieces again (lib/lesson-audio/voice.ts).
  practice-worker:
    build: practice-worker
    image: lab-practice-worker:1
    container_name: practice-worker
    restart: unless-stopped
    env_file: practice-worker/.env
    environment:
      LESSON_PIECES_DIR: /var/lib/adc/pieces
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - lesson-pieces:/var/lib/adc/pieces
    stop_grace_period: 3m
    mem_limit: 3g
    depends_on:
      - grader

  # The self-hosted voice (pocket-tts/Dockerfile, docs/voice.md "The free voice"): Kyutai's Pocket TTS, one container
  # per language, each using at most 2 of the server's 4 cores while it speaks and idle otherwise. On a network of its
  # own with the learning service, so learners' Jupyter containers (on the jupyterhub network) can't reach it; no port
  # is published. The models are kept on the pocket-tts-cache volume, made by the speed test (docker volume create
  # pocket-tts-cache if it's missing), so a rebuild doesn't download them again.
  pocket-tts-en:
    build: pocket-tts
    image: lab-pocket-tts:4.0.1
    container_name: pocket-tts-en
    restart: unless-stopped
    environment:
      POCKET_LANGUAGE: english
      POCKET_QUANTIZE: "0"
    volumes:
      - pocket-tts-cache:/root/.cache/huggingface
    cpus: 2
    mem_limit: 2g
    networks:
      - voice

  pocket-tts-es:
    build: pocket-tts
    image: lab-pocket-tts:4.0.1
    container_name: pocket-tts-es
    restart: unless-stopped
    environment:
      POCKET_LANGUAGE: spanish
      POCKET_QUANTIZE: "0"
    volumes:
      - pocket-tts-cache:/root/.cache/huggingface
    cpus: 2
    mem_limit: 2g
    networks:
      - voice

networks:
  jupyterhub:
    name: jupyterhub
  voice:
    name: lab-voice

volumes:
  hub-data:
  lesson-pieces:
  pocket-tts-cache:
    external: true
