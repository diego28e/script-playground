# The lab's hub, and the learning service (the AI tutor's backend). Student containers are not listed here: the hub
# starts one per student from LAB_IMAGE, on the same network, where they reach the service as http://learning:8080.
# Needs Docker Compose v2: `docker compose up -d --build` from this folder (see README.md).
name: lab

services:
  hub:
    build: hub
    image: lab-hub:6.1.1
    container_name: jupyterhub
    restart: unless-stopped
    env_file: .env
    environment:
      LAB_NETWORK: jupyterhub
      LAB_HUB_HOST: jupyterhub
    # Loopback only: nginx on the host terminates TLS. A published 0.0.0.0 port would skip the host firewall.
    ports:
      - "127.0.0.1:${LAB_HUB_PORT:-8000}:8000"
    volumes:
      # Lets the hub start and stop student containers. This makes the hub root-equivalent on the host:
      # no student code ever runs in it, and student containers never get the socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - hub-data:/srv/jupyterhub/data
    networks:
      - jupyterhub

  # The AI tutor's backend (docs/ai-tutor.md). Build its bundle on your PC first: `pnpm learning:build`.
  # No published port: only containers on the jupyterhub network reach it, and it checks every learner with the hub.
  learning:
    build: learning
    image: lab-learning:1
    container_name: learning
    restart: unless-stopped
    env_file: learning/.env
    environment:
      HUB_API_URL: http://jupyterhub:8081/hub/api
      PORT: "8080"
    mem_limit: 512m
    depends_on:
      - hub
    networks:
      - jupyterhub

  # The practice grader (grader/server.mjs, docs/practice.md): runs learners' code answers in throwaway containers from
  # the student image, with no network and the gVisor runtime. Loopback port only: nginx serves it at /grader/ on the
  # lab's domain, and the platform signs every request with GRADER_SECRET (grader/.env).
  grader:
    build: grader
    image: lab-grader:1
    container_name: grader
    restart: unless-stopped
    env_file: grader/.env
    environment:
      GRADER_IMAGE: ${LAB_IMAGE}
      GRADER_RUNTIME: ${GRADER_RUNTIME:-runsc}
      PORT: "8080"
    ports:
      - "127.0.0.1:${GRADER_PORT:-8090}:8080"
    volumes:
      # Starts and removes the grading containers. Root-equivalent on the host, like the hub's: no learner code runs here.
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 256m

  # Bulk practice work the admin page starts (docs/practice.md "Jobs"): writes missing tasks and drafts lessons, with no
  # request time limit. It reaches the grader on the lab's default network (GRADER_URL=http://grader:8080) and the
  # platform's database and model APIs over the internet; nothing reaches it. On a stop it finishes the items in
  # progress first, hence the long grace period.
  practice-worker:
    build: practice-worker
    image: lab-practice-worker:1
    container_name: practice-worker
    restart: unless-stopped
    env_file: practice-worker/.env
    stop_grace_period: 3m
    mem_limit: 512m
    depends_on:
      - grader

networks:
  jupyterhub:
    name: jupyterhub

volumes:
  hub-data:
