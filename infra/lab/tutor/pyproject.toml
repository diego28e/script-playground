[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academia-tutor"
version = "0.1.0"
description = "Academia del Código's AI tutor in JupyterLab: the server side, which forwards to the learning service."
requires-python = ">=3.11"
dependencies = ["jupyter_server>=2"]

[tool.setuptools]
packages = ["academia_tutor"]
